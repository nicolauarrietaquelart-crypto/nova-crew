
name: Instalar NOVA Crew

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir -p /tmp/nova
          unzip -q NOVA_Crew_v13_Netlify_completa.zip -d /tmp/nova
          cp -a /tmp/nova/. .
          rm NOVA_Crew_v13_Netlify_completa.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Instalar NOVA Crew v13" || exit 0
          git push
